<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Tahoma, Arial, sans-serif;
  background: #f8f5f0;
  color: #241b16;
  line-height: 1.6;
}

a {
  text-decoration: none;
  color: inherit;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248,245,240,.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #e5ddd4;
}

.nav {
  max-width: 1100px;
  margin: auto;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  color: #4a2d20;
}

.logo span {
  display: block;
  font-size: 10px;
  letter-spacing: 4px;
  color: #9b765f;
  text-align: center;
}

nav {
  display: flex;
  gap: 8px;
}

nav a {
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;
}

nav a:hover {
  background: #eadfd5;
}

/* HERO */

.hero {
  max-width: 1100px;
  margin: auto;
  padding: 75px 18px 55px;
  text-align: center;
}

.badge {
  display: inline-block;
  background: #eadfd5;
  color: #654333;
  padding: 7px 16px;
  border-radius: 30px;
  font-size: 13px;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(42px, 8vw, 75px);
  line-height: 1;
  color: #3b251b;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  color: #6c5a4f;
  max-width: 600px;
  margin: 0 auto 28px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 22px;
  border-radius: 30px;
  font-weight: bold;
  border: 1px solid #4a2d20;
  transition: .2s;
}

.btn.primary {
  background: #4a2d20;
  color: white;
}

.btn:hover {
  transform: translateY(-2px);
}

/* SECTIONS */

section {
  max-width: 1100px;
  margin: auto;
  padding: 45px 18px;
}

.section-title {
  text-align: center;
  margin-bottom: 25px;
}

.section-title h2 {
  font-size: 32px;
  color: #3b251b;
}

.section-title p {
  color: #7b6b61;
}

/* TABS */

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 15px;
  margin-bottom: 25px;
  justify-content: center;
}

.tab {
  white-space: nowrap;
  border: 1px solid #d8c9bd;
  background: white;
  padding: 10px 17px;
  border-radius: 25px;
  cursor: pointer;
  font-family: inherit;
}

.tab.active {
  background: #4a2d20;
  color: white;
  border-color: #4a2d20;
}

/* MENU CARDS */

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
  gap: 18px;
}

.card {
  background: white;
  border: 1px solid #e6ddd5;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(50,35,25,.06);
  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(50,35,25,.11);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  background: #eee;
}

.card-body {
  padding: 14px;
}

.card h3 {
  font-size: 18px;
  margin-bottom: 7px;
}

.price {
  color: #7b4f37;
  font-weight: 800;
  font-size: 15px;
  white-space: pre-line;
}

/* CONTACT */

.contact {
  background: #eee6de;
  border-radius: 25px;
  text-align: center;
  padding: 38px 18px;
}

.contact-grid {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.contact a {
  background: white;
  padding: 13px 20px;
  border-radius: 14px;
  border: 1px solid #ded1c6;
  font-weight: bold;
  min-width: 145px;
}

footer {
  text-align: center;
  padding: 30px 15px;
  color: #87766c;
  font-size: 13px;
}

.hidden {
  display: none !important;
}

/* MOBILE */

@media(max-width:650px) {

  nav {
    display: none;
  }

  .hero {
    padding-top: 50px;
  }

  .menu-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
  }

  .card img {
    height: 145px;
  }

  .card-body {
    padding: 11px;
  }

  .card h3 {
    font-size: 15px;
  }

  .price {
    font-size: 13px;
  }

  .tabs {
    justify-content: flex-start;
  }

}

</style>

function showSection(id, button) {

document
.querySelectorAll("#menu > .menu-grid")
.forEach(section => {
section.classList.add("hidden");
});

document
.getElementById(id)
.classList.remove("hidden");

document
.querySelectorAll(".tab")
.forEach(tab => {
tab.classList.remove("active");
});
